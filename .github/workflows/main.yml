name: FIX11 Stage6 Forward Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "Run mode"

        required: true

        type: choice

        options:

          - test

          - snapshot

          - decision

          - result

        default: test

  schedule:

    # JST 08:50

    # 1分足履歴用スナップショット

    - cron: "50 23 * * 0-4"

    # JST 12:45

    # Forward判定

    - cron: "45 3 * * 1-5"

    # JST 15:45

    # 決済確認・結果

    - cron: "45 6 * * 1-5"

permissions:

  contents: read

  id-token: write

jobs:

  run-paper-trader:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ======================================================

      # CHECKOUT

      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4

      # ======================================================

      # GOOGLE CLOUD AUTH

      # ======================================================

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}

          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud

        uses: google-github-actions/setup-gcloud@v3

      # ======================================================

      # RUN MODE

      # ======================================================

      - name: Determine run mode

        id: mode

        shell: bash

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            MODE="${{ inputs.run_mode }}"

          else

            HOUR="$(date -u +'%H')"

            MINUTE="$(date -u +'%M')"

            if [ "$HOUR" = "23" ]; then

              MODE="snapshot"

            elif [ "$HOUR" = "03" ]; then

              MODE="decision"

            elif [ "$HOUR" = "06" ]; then

              MODE="result"

            else

              MODE="test"

            fi

          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          echo "RUN MODE = $MODE"

      # ======================================================

      # CONFIG

      # ======================================================

      - name: Set Google Cloud project

        shell: bash

        run: |

          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"

      # ======================================================

      # BUILD

      # ======================================================

      - name: Configure Docker authentication

        shell: bash

        run: |

          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry exists

        shell: bash

        run: |

          if ! gcloud artifacts repositories describe paper-trader \

            --location=asia-northeast1 \

            --project="${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1

          then

            gcloud artifacts repositories create paper-trader \

              --repository-format=docker \

              --location=asia-northeast1 \

              --project="${{ secrets.GCP_PROJECT_ID }}"

          fi

      - name: Build Docker image

        shell: bash

        run: |

          IMAGE="asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/paper-trader/fix11-forward:${{ github.sha }}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          docker build \

            -t "$IMAGE" \

            .

      - name: Push Docker image

        shell: bash

        run: |

          docker push "$IMAGE"

      # ======================================================

      # CLOUD RUN

      # ======================================================

      - name: Deploy Cloud Run service

        shell: bash

        run: |

          gcloud run deploy fix11-forward-paper-trader \

            --image="$IMAGE" \

            --region=asia-northeast1 \

            --platform=managed \

            --service-account="${{ secrets.WIF_SERVICE_ACCOUNT }}" \

            --set-env-vars="GCS_BUCKET=${{ secrets.GCS_BUCKET }}" \

            --memory=2Gi \

            --cpu=2 \

            --timeout=3600 \

            --min-instances=0 \

            --max-instances=1 \

            --no-allow-unauthenticated \

            --quiet

      # ======================================================

      # SERVICE URL

      # ======================================================

      - name: Get Cloud Run URL

        shell: bash

        run: |

          SERVICE_URL="$(gcloud run services describe fix11-forward-paper-trader \

            --region=asia-northeast1 \

            --format='value(status.url)')"

          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

          echo "Cloud Run URL:"

          echo "$SERVICE_URL"

      # ======================================================

      # EXECUTE

      # ======================================================

      - name: Run paper trader

        shell: bash

        run: |

          MODE="${{ steps.mode.outputs.mode }}"

          echo "================================"

          echo "FIX11 Stage6 Forward"

          echo "MODE=$MODE"

          echo "================================"

          TOKEN="$(gcloud auth print-identity-token)"

          curl \

            --fail \

            --show-error \

            --silent \

            --max-time 3600 \

            -H "Authorization: Bearer $TOKEN" \

            "${SERVICE_URL}/run?mode=${MODE}" \

            | tee result.txt

          echo ""

          echo "================================"

          echo "RESULT"

          echo "================================"

          cat result.txt

      # ======================================================

      # EMAIL

      # ======================================================

      - name: Send result email

        if: always()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: ${{ secrets.SMTP_HOST }}

          server_port: ${{ secrets.SMTP_PORT }}

          username: ${{ secrets.SMTP_USER }}

          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "FIX11 Forward ${{ steps.mode.outputs.mode }}"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USER }}

          body: file://result.txt
