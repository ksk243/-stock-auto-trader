name: v33.20 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "decision / result / test"

        required: true

        default: "test"

permissions:

  contents: write

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  REGION: asia-northeast1

  REPOSITORY: paper-trader

  IMAGE: asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

  WIF_PROVIDER: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

  GCS_BUCKET: stock-auto-trader-506100-paper

jobs:

  paper-trader:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ env.WIF_PROVIDER }}

          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker

        run: |

          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Create Artifact Registry

        run: |

          if ! gcloud artifacts repositories describe paper-trader \

            --location=asia-northeast1 \

            --project=stock-auto-trader-506100 \

            >/dev/null 2>&1; then

            gcloud artifacts repositories create paper-trader \

              --repository-format=docker \

              --location=asia-northeast1 \

              --project=stock-auto-trader-506100 \

              --description="Paper Trader Docker Repository"

          fi

      - name: Docker Build

        run: |

          docker build \

            -t asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader:latest \

            .

      - name: Docker Push

        run: |

          docker push \

            asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader:latest

      - name: Deploy Cloud Run

        run: |

          gcloud run deploy paper-trader \

            --image=asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader:latest \

            --region=asia-northeast1 \

            --project=stock-auto-trader-506100 \

            --platform=managed \

            --allow-unauthenticated \

            --set-env-vars="RUN_MODE=${{ inputs.run_mode }},GCS_BUCKET=stock-auto-trader-506100-paper"

      - name: Wait for Cloud Run

        run: |

          gcloud run services describe paper-trader \

            --region=asia-northeast1 \

            --project=stock-auto-trader-506100 \

            --format="value(status.latestReadyRevisionName)"

      - name: Download latest result

        run: |

          rm -f latest_result.txt

          gcloud storage cp \

            gs://stock-auto-trader-506100-paper/latest_result.txt \

            ./latest_result.txt

          test -s latest_result.txt

      - name: Download research data

        run: |

          mkdir -p data/research

          if gcloud storage cp \

            gs://stock-auto-trader-506100-paper/research/screening_history.csv \

            data/research/screening_history.csv; then

            echo "Research data downloaded"

          else

            echo "Research data not found in GCS"

          fi

      - name: Save research data to GitHub

        run: |

          if [ -f data/research/screening_history.csv ]; then

            git config user.name "github-actions[bot]"

            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/research/screening_history.csv

            if ! git diff --cached --quiet; then

              git commit -m "Update research data"

              git push

            else

              echo "No research data changes"

            fi

          else

            echo "No research CSV - skip GitHub save"

          fi

      - name: Send result email

        if: always() && hashFiles('latest_result.txt') != ''

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: ${{ secrets.SMTP_HOST }}

          server_port: ${{ secrets.SMTP_PORT }}

          username: ${{ secrets.SMTP_USER }}

          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "v33.20 Paper Trader - ${{ inputs.run_mode }}"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USER }}

          body: file://latest_result.txt

          attachments: latest_result.txt
