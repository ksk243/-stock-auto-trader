name: v33.8 Paper Trader

on:

  workflow_dispatch:

  schedule:

    - cron: "30 3 * * 1-5"

jobs:

  deploy-and-run:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:

      contents: write

      id-token: write

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Check GitHub Repository

        run: |

          echo "Repository: ${{ github.repository }}"

          echo "Owner: ${{ github.repository_owner }}"

          echo "Ref: ${{ github.ref }}"

      - name: Google Cloud Auth

        uses: google-github-actions/auth@v2

        with:

          workload_identity_provider: "projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github"

          service_account: "github-actions@stock-auto-trader-506100.iam.gserviceaccount.com"

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker

        run: |

          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and Push

        run: |

          docker build -t asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-8:latest .

          docker push asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-8:latest

      - name: Deploy Cloud Run Job

        run: |

          gcloud run jobs deploy v33-8-paper-trader \

            --image=asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-8:latest \

            --region=asia-northeast1 \

            --tasks=1 \

            --max-retries=1

      - name: Run Cloud Run Job

        run: |

          gcloud run jobs execute v33-8-paper-trader \

            --region=asia-northeast1 \

            --wait

      - name: Save data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ *.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then

            git commit -m "Update v33.8 paper trading data"

            git push

          else

            echo "No changes"

          fi
