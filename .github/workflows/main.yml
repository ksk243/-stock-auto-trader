name: v33 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "実行モード"

        required: true

        default: "decision"

        type: choice

        options:

          - decision

          - result

          - test

jobs:

  deploy-and-run:

    runs-on: ubuntu-latest

    permissions:

      contents: read

    steps:

      # =====================================================

      # CHECKOUT

      # =====================================================

      - name: Checkout

        uses: actions/checkout@v4

      # =====================================================

      # GOOGLE AUTH

      # =====================================================

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v2

        with:

          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # =====================================================

      # SETUP GCLOUD

      # =====================================================

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v2

      # =====================================================

      # BUILD

      # =====================================================

      - name: Build Docker image

        run: |

          gcloud builds submit \

            --tag asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/paper-trader/paper-trader:latest \

            .

      # =====================================================

      # RUN CLOUD RUN JOB

      # =====================================================

      - name: Run Cloud Run Job

        env:

          RUN_MODE: ${{ inputs.run_mode }}

        run: |

          echo "================================"

          echo "RUN MODE = ${RUN_MODE}"

          echo "================================"

          gcloud run jobs execute paper-trader \

            --region=asia-northeast1 \

            --update-env-vars="RUN_MODE=${RUN_MODE}" \

            --wait

      # =====================================================

      # GET RESULT

      # =====================================================

      - name: Get latest result

        env:

          RUN_MODE: ${{ inputs.run_mode }}

        run: |

          echo "================================"

          echo "LATEST RESULT"

          echo "================================"

          echo "RUN_MODE=${RUN_MODE}"

          echo

          gcloud logging read \

            'resource.type="cloud_run_job" AND resource.labels.job_name="paper-trader"' \

            --project="${{ secrets.GCP_PROJECT_ID }}" \

            --limit=100 \

            --format='value(textPayload)' \

            | tail -n 200

          echo "================================"
