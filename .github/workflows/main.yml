name: v33.9 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "実行モード"

        required: true

        type: choice

        options:

          - decision

          - result

        default: decision

  schedule:

    # 平日 12:45 JST

    - cron: "45 3 * * 1-5"

    # 平日 15:45 JST

    - cron: "45 6 * * 1-5"

jobs:

  deploy-and-run:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:

      contents: write

      id-token: write

    steps:

      # ======================================================

      # Checkout

      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4

      # ======================================================

      # RUN_MODE

      # ======================================================

      - name: Set RUN_MODE

        shell: bash

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            RUN_MODE="${{ inputs.run_mode }}"

          else

            HOUR=$(TZ=Asia/Tokyo date +%H)

            if [ "$HOUR" = "12" ]; then

              RUN_MODE="decision"

            else

              RUN_MODE="result"

            fi

          fi

          echo "RUN_MODE=$RUN_MODE" >> "$GITHUB_ENV"

          echo "================================"

          echo "RUN_MODE=$RUN_MODE"

          echo "================================"

      # ======================================================

      # Google Cloud Auth

      # ======================================================

      - name: Google Cloud Auth

        uses: google-github-actions/auth@v2

        with:

          workload_identity_provider: "projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github"

          service_account: "github-actions@stock-auto-trader-506100.iam.gserviceaccount.com"

      # ======================================================

      # gcloud

      # ======================================================

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v2

      # ======================================================

      # Docker

      # ======================================================

      - name: Configure Docker

        run: |

          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # ======================================================

      # Build

      # ======================================================

      - name: Build Docker Image

        run: |

          docker build \

            --no-cache \

            -t asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-9:latest \

            .

      # ======================================================

      # Push

      # ======================================================

      - name: Push Docker Image

        run: |

          docker push asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-9:latest

      # ======================================================

      # Deploy

      # ======================================================

      - name: Deploy Cloud Run Job

        run: gcloud run jobs deploy v33-9-paper-trader --image=asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-9:latest --region=asia-northeast1 --tasks=1 --max-retries=1 --set-env-vars=RUN_MODE=$RUN_MODE

      # ======================================================

      # Execute

      # ======================================================

      - name: Run Cloud Run Job

        run: |

          gcloud run jobs execute v33-9-paper-trader \

            --region=asia-northeast1 \

            --wait

      # ======================================================

      # Get execution

      # ======================================================

      - name: Get Latest Execution

        shell: bash

        run: |

          EXECUTION_NAME=$(gcloud run jobs executions list \

            --job=v33-9-paper-trader \

            --region=asia-northeast1 \

            --project=stock-auto-trader-506100 \

            --sort-by="~createTime" \

            --limit=1 \

            --format="value(metadata.name)")

          echo "EXECUTION_NAME=$EXECUTION_NAME"

          echo "EXECUTION_NAME=$EXECUTION_NAME" >> "$GITHUB_ENV"

      # ======================================================

      # Get Cloud Run Log

      # ======================================================

      - name: Get Cloud Run Result

        shell: bash

        run: |

          mkdir -p data

          echo "================================"

          echo "Cloud Run log"

          echo "================================"

          gcloud logging read \

            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"v33-9-paper-trader\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION_NAME\"" \

            --project=stock-auto-trader-506100 \

            --limit=1000 \

            --order=asc \

            --format="value(textPayload)" \

            > data/cloud_run_raw.txt

          cat data/cloud_run_raw.txt

          echo "================================"

          echo "Extracting result"

          echo "================================"

          if [ "$RUN_MODE" = "decision" ]; then

            awk '

              /12:45 判定/ {

                found=1

              }

              found {

                print

              }

              found && /v33\.9 END/ {

                exit

              }

            ' data/cloud_run_raw.txt > data/latest_result.txt

          else

            awk '

              /15:45 結果/ {

                found=1

              }

              found {

                print

              }

              found && /v33\.9 END/ {

                exit

              }

            ' data/cloud_run_raw.txt > data/latest_result.txt

          fi

      # ======================================================

      # Fallback

      # ======================================================

      - name: Check Result

        shell: bash

        run: |

          echo "================================"

          echo "latest_result.txt"

          echo "================================"

          if [ -s data/latest_result.txt ]; then

            cat data/latest_result.txt

          else

            echo "結果を取得できませんでした。"

            echo ""

            echo "Cloud Run output:"

            cat data/cloud_run_raw.txt

            echo ""

            echo "RUN_MODE=$RUN_MODE"

            exit 1

          fi

      # ======================================================

      # Save Result

      # ======================================================

      - name: Save Result

        shell: bash

        run: |

          rm -f data/cloud_run_raw.txt

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest_result.txt

          if ! git diff --cached --quiet; then

            git commit -m "Update v33.9 result"

            git push

          else

            echo "No result changes"

          fi

      # ======================================================

      # Send Mail

      # ======================================================

      - name: Send Email

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.mail.me.com

          server_port: 587

          username: ${{ secrets.MAIL_USER }}

          password: ${{ secrets.MAIL_PASS }}

          subject: "v33.9 Paper Trader"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USER }}

          body: file://data/latest_result.txt
