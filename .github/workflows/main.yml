name: v29.6 Paper Trader

on:

  # ==========================================================

  # GitHub schedule

  #

  # 12:45の本番トリガーには依存しない

  # 外部スケジューラからworkflow_dispatchする

  #

  # scheduleはバックアップ

  # ==========================================================

  schedule:

    # 日本時間 12:45

    - cron: "45 3 * * 1-5"

    # 日本時間 15:45

    - cron: "45 6 * * 1-5"

  # ==========================================================

  # 外部スケジューラ / 手動実行

  # ==========================================================

  workflow_dispatch:

    inputs:

      force_1245:

        description: "12:45メールを強制テスト"

        required: false

        default: false

        type: boolean

      force_1545:

        description: "15:45メールを強制テスト"

        required: false

        default: false

        type: boolean

jobs:

  run-paper-trader:

    runs-on: ubuntu-latest

    steps:

      # ======================================================

      # Checkout

      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4

      # ======================================================

      # Python

      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      # ======================================================

      # Dependencies

      # ======================================================

      - name: Install dependencies

        run: |

          pip install yfinance pandas numpy

      # ======================================================

      # Paper Trader

      # ======================================================

      - name: Run paper trader

        env:

          SMTP_HOST: ${{ secrets.SMTP_HOST }}

          SMTP_PORT: ${{ secrets.SMTP_PORT }}

          SMTP_USER: ${{ secrets.SMTP_USER }}

          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          MAIL_TO: ${{ secrets.MAIL_TO }}

          FORCE_1245: ${{ inputs.force_1245 && '1' || '' }}

          FORCE_1545: ${{ inputs.force_1545 && '1' || '' }}

        run: |

          echo "UTC : $(date -u)"

          echo "JST : $(TZ=Asia/Tokyo date)"

          python paper_trader.py

      # ======================================================

      # Save data

      # ======================================================

      - name: Save data

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \

            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d "data" ]; then

            git add data/

            if ! git diff --cached --quiet; then

              git commit \

                -m "Update v29.6 paper trading data"

              git push

            else

              echo "No data changes"

            fi

          else

            echo "data directory does not exist"

          fi
