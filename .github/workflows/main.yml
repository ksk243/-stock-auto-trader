name: v33.20 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "decision / result / test"

        required: true

        default: "test"

permissions:

  contents: write

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  REGION: asia-northeast1

  REPOSITORY: paper-trader

  IMAGE: asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

  WIF_PROVIDER: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

  GCS_BUCKET: stock-auto-trader-506100-paper

jobs:

  paper-trader:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================

      # Checkout

      # ==========================================================

      - name: Checkout

        uses: actions/checkout@v4

      # ==========================================================

      # Google Cloud 認証

      # ==========================================================

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ env.WIF_PROVIDER }}

          service_account: ${{ env.SERVICE_ACCOUNT }}

      # ==========================================================

      # gcloud

      # ==========================================================

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: ${{ env.PROJECT_ID }}

      # ==========================================================

      # Docker認証

      # ==========================================================

      - name: Configure Docker

        run: |

          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # ==========================================================

      # Artifact Registry

      # ==========================================================

      - name: Create Artifact Registry

        run: |

          gcloud artifacts repositories describe "$REPOSITORY" \

            --location="$REGION" \

            --project="$PROJECT_ID" \

            >/dev/null 2>&1 || \

          gcloud artifacts repositories create "$REPOSITORY" \

            --repository-format=docker \

            --location="$REGION" \

            --project="$PROJECT_ID" \

            --description="Paper Trader Docker Repository"

      # ==========================================================

      # Docker Build

      # ==========================================================

      - name: Docker Build

        run: |

          docker build -t "$IMAGE:latest" .

      # ==========================================================

      # Docker Push

      # ==========================================================

      - name: Docker Push

        run: |

          docker push "$IMAGE:latest"

      # ==========================================================

      # Cloud Run Deploy

      # ==========================================================

      - name: Deploy Cloud Run

        run: |

          gcloud run deploy paper-trader \

            --image="$IMAGE:latest" \

            --region="$REGION" \

            --project="$PROJECT_ID" \

            --platform=managed \

            --allow-unauthenticated \

            --set-env-vars="RUN_MODE=${{ inputs.run_mode }},GCS_BUCKET=$GCS_BUCKET"

      # ==========================================================

      # Cloud Run 実行待ち

      # ==========================================================

      - name: Wait for Paper Trader

        run: |

          sleep 30

      # ==========================================================

      # latest_result.txt をGCSから取得

      # ==========================================================

      - name: Download latest result

        run: |

          rm -f latest_result.txt

          gcloud storage cp \

            "gs://$GCS_BUCKET/latest_result.txt" \

            "latest_result.txt"

          echo "latest_result.txt downloaded"

      # ==========================================================

      # research CSV をGCSから取得

      # ==========================================================

      - name: Download research data

        run: |

          mkdir -p data/research

          gcloud storage cp \

            "gs://$GCS_BUCKET/research/screening_history.csv" \

            "data/research/screening_history.csv" \

            || true

          if [ -f data/research/screening_history.csv ]; then

            echo "research CSV downloaded"

          else

            echo "research CSV not found"

          fi

      # ==========================================================

      # GitHubへ研究データ保存

      # ==========================================================

      - name: Save research data to GitHub

        run: |

          if [ -f data/research/screening_history.csv ]; then

            git config user.name "github-actions[bot]"

            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/research/screening_history.csv

            if git diff --cached --quiet; then

              echo "No research data changes"

            else

              git commit -m "Update research data"

              git push

            fi

          else

            echo "research CSV not found - skip GitHub update"

          fi

      # ==========================================================

      # メール送信

      # ==========================================================

      - name: Send result email

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: ${{ secrets.SMTP_HOST }}

          server_port: ${{ secrets.SMTP_PORT }}

          username: ${{ secrets.SMTP_USER }}

          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "v33.20 Paper Trader - ${{ inputs.run_mode }}"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USER }}

          secure: true

          body: file://latest_result.txt

      # ==========================================================

      # 完了

      # ==========================================================

      - name: Finished

        run: |

          echo "================================"

          echo "v33.20 Paper Trader END"

          echo "RUN_MODE: ${{ inputs.run_mode }}"

          echo "================================"
