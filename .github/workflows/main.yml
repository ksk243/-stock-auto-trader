name: FIX11 Forward Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "実行モード"

        required: true

        type: choice

        options:

          - decision

          - result

          - test

        default: test

  schedule:

    # ========================================================

    # JST 09:15

    # Yahoo 1m履歴保存・RVOL20育成用

    # UTC 00:15

    # ========================================================

    - cron: "15 0 * * 1-5"

    # ========================================================

    # JST 12:45

    # 前場～昼のデータ保存

    # UTC 03:45

    # ========================================================

    - cron: "45 3 * * 1-5"

    # ========================================================

    # JST 15:45

    # 当日最終処理

    # UTC 06:45

    # ========================================================

    - cron: "45 6 * * 1-5"

permissions:

  contents: read

  id-token: write

env:

  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  REGION: asia-northeast1

  SERVICE_NAME: fix11-paper-trader

  IMAGE_NAME: fix11-paper-trader

  GCS_BUCKET: ${{ secrets.GCS_BUCKET }}

jobs:

  deploy-and-run:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ======================================================

      # Checkout

      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4

      # ======================================================

      # Google Cloud Authentication

      # ======================================================

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}

          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # ======================================================

      # gcloud

      # ======================================================

      - name: Set up Cloud SDK

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: ${{ env.PROJECT_ID }}

      # ======================================================

      # Docker authentication

      # ======================================================

      - name: Configure Docker

        run: |

          gcloud auth configure-docker \

            ${REGION}-docker.pkg.dev \

            --quiet

      # ======================================================

      # Artifact Registry

      # ======================================================

      - name: Ensure Artifact Registry

        run: |

          if ! gcloud artifacts repositories describe "${IMAGE_NAME}" \

            --location="${REGION}" \

            --project="${PROJECT_ID}" >/dev/null 2>&1

          then

            gcloud artifacts repositories create "${IMAGE_NAME}" \

              --repository-format=docker \

              --location="${REGION}" \

              --project="${PROJECT_ID}"

          fi

      # ======================================================

      # Image path

      # ======================================================

      - name: Set image path

        run: |

          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${IMAGE_NAME}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # ======================================================

      # Build

      # ======================================================

      - name: Build Docker image

        run: |

          docker build \

            -t "${IMAGE}" \

            .

      # ======================================================

      # Push

      # ======================================================

      - name: Push Docker image

        run: |

          docker push "${IMAGE}"

      # ======================================================

      # Deploy Cloud Run

      #

      # paper trading only

      # ======================================================

      - name: Deploy Cloud Run

        run: |

          gcloud run deploy "${SERVICE_NAME}" \

            --image="${IMAGE}" \

            --region="${REGION}" \

            --project="${PROJECT_ID}" \

            --platform=managed \

            --allow-unauthenticated \

            --memory=4Gi \

            --cpu=2 \

            --timeout=3600 \

            --concurrency=1 \

            --max-instances=1 \

            --set-env-vars="TZ=Asia/Tokyo,GCS_BUCKET=${GCS_BUCKET},FIX11_DATA_DIR=/tmp/fix11"

      # ======================================================

      # Get URL

      # ======================================================

      - name: Get Cloud Run URL

        run: |

          URL=$(gcloud run services describe "${SERVICE_NAME}" \

            --region="${REGION}" \

            --project="${PROJECT_ID}" \

            --format='value(status.url)')

          echo "SERVICE_URL=${URL}" >> "$GITHUB_ENV"

          echo "Cloud Run URL:"

          echo "${URL}"

      # ======================================================

      # Decide mode

      # ======================================================

      - name: Decide run mode

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            MODE="${{ inputs.run_mode }}"

          else

            HOUR=$(TZ=Asia/Tokyo date +%H)

            MINUTE=$(TZ=Asia/Tokyo date +%M)

            if [ "$HOUR" = "09" ]; then

              MODE="snapshot"

            elif [ "$HOUR" = "12" ]; then

              MODE="decision"

            else

              MODE="result"

            fi

          fi

          echo "RUN_MODE=${MODE}" >> "$GITHUB_ENV"

          echo "RUN_MODE=${MODE}"

      # ======================================================

      # Run FIX11

      # ======================================================

      - name: Run FIX11 Forward

        run: |

          set -e

          echo "========================================"

          echo "FIX11 Forward"

          echo "RUN_MODE=${RUN_MODE}"

          echo "========================================"

          curl \

            --fail \

            --show-error \

            --silent \

            --max-time 3550 \

            "${SERVICE_URL}/run?mode=${RUN_MODE}" \

            | tee fix11_result.txt

      # ======================================================

      # Result

      # ======================================================

      - name: Show result

        if: always()

        run: |

          echo "========================================"

          echo "FIX11 RESULT"

          echo "========================================"

          if [ -f fix11_result.txt ]; then

            cat fix11_result.txt

          else

            echo "fix11_result.txt not created"

          fi

      # ======================================================

      # Email

      #

      # Existing Gmail/iCloud mail secrets are reused.

      # ======================================================

      - name: Prepare email

        if: always()

        run: |

          if [ -f fix11_result.txt ]; then

            cp fix11_result.txt mail_body.txt

          else

            echo "FIX11 Forward execution failed before result creation." > mail_body.txt

          fi

          echo "" >> mail_body.txt

          echo "GitHub Actions:" >> mail_body.txt

          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> mail_body.txt

      - name: Send result email

        if: always()

        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "FIX11 Forward ${{ env.RUN_MODE }}"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_FROM }}

          body: file://mail_body.txt
