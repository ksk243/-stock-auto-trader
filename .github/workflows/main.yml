name: v33.20 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "decision / result / test"

        required: true

        default: "test"

permissions:

  contents: write

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  REGION: asia-northeast1

  REPOSITORY: paper-trader

  IMAGE: asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

  WIF_PROVIDER: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

  GCS_BUCKET: stock-auto-trader-506100-paper

jobs:

  paper-trader:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ env.WIF_PROVIDER }}

          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker

        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Test

        run: |

          echo "========================================"

          echo "v33.20 Paper Trader"

          echo "Google Cloud authentication OK"

          echo "Docker configuration OK"

          echo "========================================"
