name: v33.18 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "実行モード"

        required: true

        type: choice

        options:

          - decision

          - result

          - test

        default: decision

  schedule:

    # 12:45 JST

    - cron: "45 3 * * 1-5"

    # 15:45 JST

    - cron: "45 6 * * 1-5"

jobs:

  deploy-and-run:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:

      contents: write

      id-token: write

    steps:

      # =====================================================

      # CHECKOUT

      # =====================================================

      - name: Checkout

        uses: actions/checkout@v4

      # =====================================================

      # RUN MODE

      # =====================================================

      - name: Set RUN_MODE

        shell: bash

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            RUN_MODE="${{ inputs.run_mode }}"

          else

            HOUR=$(TZ=Asia/Tokyo date +%H)

            if [ "$HOUR" = "12" ]; then

              RUN_MODE="decision"

            else

              RUN_MODE="result"

            fi

          fi

          echo "RUN_MODE=$RUN_MODE" >> "$GITHUB_ENV"

          echo "================================"

          echo "RUN_MODE=$RUN_MODE"

          echo "================================"

      # =====================================================

      # GOOGLE CLOUD AUTH

      # =====================================================

      - name: Google Cloud Auth

        uses: google-github-actions/auth@v2

        with:

          workload_identity_provider: "projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github"

          service_account: "github-actions@stock-auto-trader-506100.iam.gserviceaccount.com"

      # =====================================================

      # SETUP GCLOUD

      # =====================================================

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v2

      # =====================================================

      # GOOGLE CLOUD PROJECT

      # =====================================================

      - name: Set Google Cloud Project

        shell: bash

        run: |

          gcloud config set project stock-auto-trader-506100

          echo "================================"

          echo "PROJECT"

          echo "================================"

          gcloud config get-value project

      # =====================================================

      # CHECK CLOUD RUN JOBS

      # =====================================================

      - name: Check Cloud Run Jobs

        shell: bash

        run: |

          echo "================================"

          echo "CLOUD RUN JOBS"

          echo "================================"

          gcloud run jobs list --region=asia-northeast1 --project=stock-auto-trader-506100

      # =====================================================

      # DOCKER AUTH

      # =====================================================

      - name: Configure Docker

        shell: bash

        run: |

          echo "================================"

          echo "DOCKER AUTH"

          echo "================================"

          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # =====================================================

      # DOCKER BUILD

      # =====================================================

      - name: Build Docker Image

        shell: bash

        run: |

          echo "================================"

          echo "DOCKER BUILD"

          echo "================================"

          docker build --no-cache -t asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-18:latest .

      # =====================================================

      # DOCKER PUSH

      # =====================================================

      - name: Push Docker Image

        shell: bash

        run: |

          echo "================================"

          echo "DOCKER PUSH"

          echo "================================"

          docker push asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-18:latest

      # =====================================================

      # VERIFY IMAGE

      # =====================================================

      - name: Verify Docker Image

        shell: bash

        run: |

          echo "================================"

          echo "VERIFY IMAGE"

          echo "================================"

          gcloud artifacts docker images describe asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-18:latest --project=stock-auto-trader-506100

      # =====================================================

      # CLOUD RUN DEPLOY

      # =====================================================

      - name: Deploy Cloud Run Job

        shell: bash

        run: |

          echo "================================"

          echo "CLOUD RUN DEPLOY"

          echo "================================"

          echo "JOB=v33-18-paper-trader"

          echo "REGION=asia-northeast1"

          echo "RUN_MODE=$RUN_MODE"

          echo "IMAGE=asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-18:latest"

          echo "================================"

          gcloud run jobs deploy v33-18-paper-trader --image=asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-18:latest --region=asia-northeast1 --project=stock-auto-trader-506100 --tasks=1 --max-retries=1 --set-env-vars="RUN_MODE=$RUN_MODE"

      # =====================================================

      # CLOUD RUN EXECUTE

      # =====================================================

      - name: Run Cloud Run Job

        shell: bash

        run: |

          echo "================================"

          echo "RUNNING CLOUD RUN JOB"

          echo "================================"

          echo "RUN_MODE=$RUN_MODE"

          echo "REGION=asia-northeast1"

          echo "JOB=v33-18-paper-trader"

          echo "================================"

          gcloud run jobs execute v33-18-paper-trader --region=asia-northeast1 --project=stock-auto-trader-506100 --wait

      # =====================================================

      # GET LATEST EXECUTION

      # =====================================================

      - name: Get Latest Execution

        shell: bash

        run: |

          echo "================================"

          echo "GET LATEST EXECUTION"

          echo "================================"

          EXECUTION_NAME=$(gcloud run jobs executions list --job=v33-18-paper-trader --region=asia-northeast1 --project=stock-auto-trader-506100 --sort-by="~createTime" --limit=1 --format="value(metadata.name)")

          if [ -z "$EXECUTION_NAME" ]; then

            echo "ERROR: Execution not found."

            exit 1

          fi

          echo "EXECUTION_NAME=$EXECUTION_NAME"

          echo "EXECUTION_NAME=$EXECUTION_NAME" >> "$GITHUB_ENV"

      # =====================================================

      # GET CLOUD RUN LOG

      # =====================================================

      - name: Get Cloud Run Result

        shell: bash

        run: |

          mkdir -p data

          echo "================================"

          echo "CLOUD RUN LOG"

          echo "================================"

          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"v33-18-paper-trader\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION_NAME\"" --project=stock-auto-trader-506100 --limit=1000 --order=asc --format="value(textPayload)" > data/cloud_run_raw.txt

          cat data/cloud_run_raw.txt

          echo "================================"

          echo "EXTRACT RESULT"

          echo "================================"

          # =================================================

          # DECISION

          # =================================================

          if [ "$RUN_MODE" = "decision" ]; then

            awk '

              /12:45 判定/ {

                found=1

              }

              found {

                print

              }

              found && /v33\.18 END/ {

                exit

              }

            ' data/cloud_run_raw.txt > data/latest_result.txt

          # =================================================

          # RESULT

          # =================================================

          elif [ "$RUN_MODE" = "result" ]; then

            awk '

              /15:45 結果/ {

                found=1

              }

              found {

                print

              }

              found && /v33\.18 END/ {

                exit

              }

            ' data/cloud_run_raw.txt > data/latest_result.txt

          # =================================================

          # TEST

          # =================================================

          elif [ "$RUN_MODE" = "test" ]; then

            awk '

              /12:45 TEST判定/ {

                found=1

              }

              found {

                print

              }

              found && /v33\.18 END/ {

                exit

              }

            ' data/cloud_run_raw.txt > data/latest_result.txt

          fi

      # =====================================================

      # CHECK RESULT

      # =====================================================

      - name: Check Result

        shell: bash

        run: |

          echo "================================"

          echo "LATEST RESULT"

          echo "================================"

          echo "RUN_MODE=$RUN_MODE"

          echo

          if [ -s data/latest_result.txt ]; then

            cat data/latest_result.txt

          else

            echo "結果を取得できませんでした。"

            echo

            echo "RUN_MODE=$RUN_MODE"

            echo

            echo "CLOUD RUN RAW LOG:"

            cat data/cloud_run_raw.txt

            exit 1

          fi

          echo "================================"

      # =====================================================

      # SAVE RESULT

      # =====================================================

      - name: Save Result

        shell: bash

        run: |

          rm -f data/cloud_run_raw.txt

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest_result.txt

          if ! git diff --cached --quiet; then

            git commit -m "Update v33.18 result"

            git push

          else

            echo "No result changes"

          fi

      # =====================================================

      # SEND EMAIL

      # =====================================================

      - name: Send Email

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.mail.me.com

          server_port: 587

          username: ${{ secrets.MAIL_USER }}

          password: ${{ secrets.MAIL_PASS }}

          subject: "v33.18 Paper Trader"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USER }}

          body: file://data/latest_result.txt
