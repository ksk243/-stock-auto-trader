name: v33.20 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "decision / result / test"

        required: true

        default: "test"

permissions:

  contents: write

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  REGION: asia-northeast1

  REPOSITORY: paper-trader

  IMAGE: asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

  WIF_PROVIDER: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

  GCS_BUCKET: stock-auto-trader-506100-paper

jobs:

  paper-trader:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ env.WIF_PROVIDER }}

          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker

        run: |

          gcloud auth configure-docker \

            ${{ env.REGION }}-docker.pkg.dev \

            --quiet

      - name: Create Artifact Registry

        run: |

          gcloud artifacts repositories describe \

            "$REPOSITORY" \

            --location="$REGION" \

            --project="$PROJECT_ID" \

            >/dev/null 2>&1 || \

          gcloud artifacts repositories create \

            "$REPOSITORY" \

            --repository-format=docker \

            --location="$REGION" \

            --project="$PROJECT_ID" \

            --description="Paper Trader Docker Repository"

      - name: Docker Build

        run: |

          docker build \

            -t "$IMAGE:latest" \

            .

      - name: Docker Push

        run: |

          docker push "$IMAGE:latest"

      - name: Create Cloud Run environment file

        env:

          RUN_MODE: ${{ inputs.run_mode }}

          GCS_BUCKET: ${{ env.GCS_BUCKET }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}

          SMTP_PORT: ${{ secrets.SMTP_PORT }}

          SMTP_USER: ${{ secrets.SMTP_USER }}

          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          MAIL_USER: ${{ secrets.MAIL_USER }}

          MAIL_PASS: ${{ secrets.MAIL_PASS }}

          MAIL_TO: ${{ secrets.MAIL_TO }}

        run: |

          cat > cloud-run-env.yaml <<EOF

          RUN_MODE: "$RUN_MODE"

          GCS_BUCKET: "$GCS_BUCKET"

          SMTP_HOST: "$SMTP_HOST"

          SMTP_PORT: "$SMTP_PORT"

          SMTP_USER: "$SMTP_USER"

          SMTP_PASSWORD: "$SMTP_PASSWORD"

          MAIL_USER: "$MAIL_USER"

          MAIL_PASS: "$MAIL_PASS"

          MAIL_TO: "$MAIL_TO"

          EOF

      - name: Deploy Cloud Run

        run: |

          gcloud run deploy paper-trader \

            --image="$IMAGE:latest" \

            --region="$REGION" \

            --project="$PROJECT_ID" \

            --platform=managed \

            --allow-unauthenticated \

            --env-vars-file=cloud-run-env.yaml

      - name: Get Cloud Run URL

        id: cloudrun

        run: |

          URL=$(gcloud run services describe paper-trader \

            --region="$REGION" \

            --project="$PROJECT_ID" \

            --format="value(status.url)")

          echo "URL=$URL" >> "$GITHUB_OUTPUT"

      - name: Run Paper Trader

        run: |

          URL="${{ steps.cloudrun.outputs.URL }}/run"

          echo "Calling:"

          echo "$URL"

          curl \

            --fail \

            --show-error \

            --silent \

            --max-time 900 \

            "$URL"

          echo

      - name: Download latest research data

        run: |

          mkdir -p data/research

          gcloud storage cp \

            "gs://$GCS_BUCKET/research/screening_history.csv" \

            "data/research/screening_history.csv" \

            || true

      - name: Download latest result

        run: |

          mkdir -p data

          gcloud storage cp \

            "gs://$GCS_BUCKET/latest_result.txt" \

            "data/latest_result.txt" \

            || true

      - name: Save research data to GitHub

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data/research/screening_history.csv ]; then

            git add data/research/screening_history.csv

          fi

          if [ -f data/latest_result.txt ]; then

            git add data/latest_result.txt

          fi

          if git diff --cached --quiet; then

            echo "No data changes"

          else

            git commit -m "Update paper trader data"

            git push

          fi
