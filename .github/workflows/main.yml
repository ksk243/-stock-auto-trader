name: v33.20 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "decision / result / test"

        required: true

        default: "test"

permissions:

  contents: write

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  REGION: asia-northeast1

  SERVICE_NAME: stock-paper-trader

  REPOSITORY: paper-trader

  IMAGE_NAME: paper-trader

  GCS_BUCKET: ${{ secrets.GCS_BUCKET }}

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

jobs:

  paper-trader:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Authenticate Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

          service_account: 913714190884-compute@developer.gserviceaccount.com

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: stock-auto-trader-506100

      - name: Configure Docker

        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build Docker image

        run: docker build -t asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader:latest .

      - name: Push Docker image

        run: docker push asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader:latest

      - name: Deploy Cloud Run

        run: gcloud run deploy stock-paper-trader --image asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader:latest --region asia-northeast1 --platform managed --no-allow-unauthenticated --service-account 913714190884-compute@developer.gserviceaccount.com --set-env-vars RUN_MODE=${{ inputs.run_mode }},GCS_BUCKET=${{ secrets.GCS_BUCKET }}

      - name: Run Cloud Run

        run: gcloud run services proxy stock-paper-trader --region asia-northeast1 --port 8080 > /tmp/cloudrun.log 2>&1 & sleep 5; curl -f -X POST http://127.0.0.1:8080/run

      - name: Download research CSV from GCS

        run: mkdir -p data/research; if gcloud storage ls "gs://${GCS_BUCKET}/research/screening_history.csv" >/dev/null 2>&1; then gcloud storage cp "gs://${GCS_BUCKET}/research/screening_history.csv" "data/research/screening_history.csv"; else echo "Research CSV not found in GCS"; fi

      - name: Save research data to GitHub

        run: git add data/research/screening_history.csv data/portfolio.json data/paper_trades.csv data/paper_candidates.csv data/latest_result.txt 2>/dev/null || true; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git diff --cached --quiet || git commit -m "Update paper trader research data"; git push

      - name: Show result

        if: always()

        run: cat data/latest_result.txt 2>/dev/null || true
