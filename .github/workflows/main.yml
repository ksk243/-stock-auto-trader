name: Afternoon Screener

on:

  workflow_dispatch:

  schedule:

    - cron: "0 3 * * 1-5"

jobs:

  run-screener:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Install dependencies

        run: |

          pip install yfinance pandas numpy

      - name: Run screener

        run: |

          python afternoon_screener.py
