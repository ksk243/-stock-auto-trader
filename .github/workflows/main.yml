name: FIX11 Stage6 Forward Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "Run mode"

        required: true

        type: choice

        options:

          - test

          - snapshot

          - decision

          - result

        default: test

  schedule:

    # JST 08:50

    - cron: "50 23 * * 0-4"

    # JST 12:45

    - cron: "45 3 * * 1-5"

    # JST 15:45

    - cron: "45 6 * * 1-5"

permissions:

  contents: read

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  PROJECT_NUMBER: "913714190884"

  REGION: asia-northeast1

  SERVICE_NAME: fix11-forward-paper-trader

  ARTIFACT_REPOSITORY: paper-trader

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

  WIF_PROVIDER: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

  GCS_BUCKET: stock-auto-trader-506100-paper

jobs:

  run-paper-trader:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ======================================================

      # CHECKOUT

      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4

      # ======================================================

      # GOOGLE CLOUD AUTH

      # ======================================================

      - name: Authenticate to Google Cloud

        id: auth

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ env.WIF_PROVIDER }}

          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup Google Cloud

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: ${{ env.PROJECT_ID }}

      # ======================================================

      # GCLOUD CONFIG

      # ======================================================

      - name: Configure gcloud

        shell: bash

        run: |

          set -e

          gcloud config set project "${PROJECT_ID}"

          echo "PROJECT_ID=${PROJECT_ID}"

          echo "REGION=${REGION}"

          echo "SERVICE_NAME=${SERVICE_NAME}"

          echo "GCS_BUCKET=${GCS_BUCKET}"

      # ======================================================

      # DETERMINE RUN MODE

      # ======================================================

      - name: Determine run mode

        id: mode

        shell: bash

        run: |

          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            MODE="${{ inputs.run_mode }}"

          else

            HOUR="$(date -u +'%H')"

            if [ "$HOUR" = "23" ]; then

              MODE="snapshot"

            elif [ "$HOUR" = "03" ]; then

              MODE="decision"

            elif [ "$HOUR" = "06" ]; then

              MODE="result"

            else

              MODE="test"

            fi

          fi

          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

          echo "RUN MODE = ${MODE}"

      # ======================================================

      # ARTIFACT REGISTRY

      # ======================================================

      - name: Configure Docker authentication

        shell: bash

        run: |

          set -e

          gcloud auth configure-docker \

            "${REGION}-docker.pkg.dev" \

            --quiet

      - name: Ensure Artifact Registry exists

        shell: bash

        run: |

          set -e

          if gcloud artifacts repositories describe \

            "${ARTIFACT_REPOSITORY}" \

            --location="${REGION}" \

            --project="${PROJECT_ID}" \

            >/dev/null 2>&1

          then

            echo "Artifact Registry already exists."

          else

            echo "Creating Artifact Registry..."

            gcloud artifacts repositories create \

              "${ARTIFACT_REPOSITORY}" \

              --repository-format=docker \

              --location="${REGION}" \

              --project="${PROJECT_ID}"

          fi

      # ======================================================

      # IMAGE

      # ======================================================

      - name: Set image name

        shell: bash

        run: |

          set -e

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/fix11-forward:${GITHUB_SHA}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "IMAGE=${IMAGE}"

      # ======================================================

      # BUILD

      # ======================================================

      - name: Build Docker image

        shell: bash

        run: |

          set -e

          docker build \

            -t "${IMAGE}" \

            .

      # ======================================================

      # PUSH

      # ======================================================

      - name: Push Docker image

        shell: bash

        run: |

          set -e

          docker push "${IMAGE}"

      # ======================================================

      # DEPLOY CLOUD RUN

      # ======================================================

      - name: Deploy Cloud Run service

        shell: bash

        run: |

          set -e

          gcloud run deploy "${SERVICE_NAME}" \

            --image="${IMAGE}" \

            --region="${REGION}" \

            --project="${PROJECT_ID}" \

            --platform=managed \

            --service-account="${SERVICE_ACCOUNT}" \

            --set-env-vars="TZ=Asia/Tokyo,GCS_BUCKET=${GCS_BUCKET},FIX11_DATA_DIR=/tmp/fix11" \

            --memory=4Gi \

            --cpu=2 \

            --timeout=3600 \

            --concurrency=1 \

            --min-instances=0 \

            --max-instances=1 \

            --no-allow-unauthenticated \

            --quiet

      # ======================================================

      # GET CLOUD RUN URL

      # ======================================================

      - name: Get Cloud Run URL

        shell: bash

        run: |

          set -e

          SERVICE_URL="$(

            gcloud run services describe \

              "${SERVICE_NAME}" \

              --region="${REGION}" \

              --project="${PROJECT_ID}" \

              --format='value(status.url)'

          )"

          if [ -z "${SERVICE_URL}" ]; then

            echo "ERROR: Cloud Run URL is empty."

            exit 1

          fi

          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"

          echo "Cloud Run URL:"

          echo "${SERVICE_URL}"

      # ======================================================

      # HEALTH CHECK

      # ======================================================

      - name: Cloud Run health check

        shell: bash

        run: |

          set -e

          TOKEN="$(gcloud auth print-identity-token)"

          curl \

            --fail \

            --show-error \

            --silent \

            --max-time 60 \

            -H "Authorization: Bearer ${TOKEN}" \

            "${SERVICE_URL}/"

          echo ""

      # ======================================================

      # EXECUTE PAPER TRADER

      # ======================================================

      - name: Run FIX11 Forward

        shell: bash

        run: |

          set -e

          MODE="${{ steps.mode.outputs.mode }}"

          echo "=========================================="

          echo "FIX11 Stage6 Forward"

          echo "MODE=${MODE}"

          echo "=========================================="

          TOKEN="$(gcloud auth print-identity-token)"

          curl \

            --fail \

            --show-error \

            --silent \

            --max-time 3550 \

            -H "Authorization: Bearer ${TOKEN}" \

            "${SERVICE_URL}/run?mode=${MODE}" \

            | tee result.txt

          echo ""

          echo "=========================================="

          echo "RESULT"

          echo "=========================================="

          cat result.txt

      # ======================================================

      # CREATE ERROR MAIL BODY IF EXECUTION FAILED

      # ======================================================

      - name: Prepare mail body

        if: always()

        shell: bash

        run: |

          if [ ! -f result.txt ]; then

            cat > result.txt <<EOF

          FIX11 Stage6 Forward

          GitHub Actions execution failed before result.txt was created.

          Run mode:

          ${{ steps.mode.outputs.mode }}

          Repository:

          ${GITHUB_REPOSITORY}

          Run ID:

          ${GITHUB_RUN_ID}

          EOF

          fi

      # ======================================================

      # EMAIL

      #

      # 既存のメールSecretsをそのまま使用

      # ======================================================

      - name: Send result email

        if: always()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: ${{ secrets.SMTP_HOST }}

          server_port: ${{ secrets.SMTP_PORT }}

          username: ${{ secrets.SMTP_USER }}

          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "FIX11 Forward ${{ steps.mode.outputs.mode }}"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USER }}

          body: file://result.txt
