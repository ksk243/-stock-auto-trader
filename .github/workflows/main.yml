name: v33.9 Paper Trader

on:

  workflow_dispatch:

  schedule:

    - cron: "45 3 * * 1-5"

    - cron: "45 6 * * 1-5"

jobs:

  deploy-and-run:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:

      contents: write

      id-token: write

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Google Cloud Auth

        uses: google-github-actions/auth@v2

        with:

          workload_identity_provider: "projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github"

          service_account: "github-actions@stock-auto-trader-506100.iam.gserviceaccount.com"

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker

        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image

        run: |

          docker build --no-cache -t asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-9:latest .

          docker push asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-9:latest

      - name: Deploy Cloud Run Job

        run: |

          gcloud run jobs deploy v33-9-paper-trader \

            --image=asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-9:latest \

            --region=asia-northeast1 \

            --tasks=1 \

            --max-retries=1

      - name: Run Cloud Run Job

        run: |

          gcloud run jobs execute v33-9-paper-trader \

            --region=asia-northeast1 \

            --wait

      - name: Get Latest Cloud Run Result

        run: |

          mkdir -p data

          EXECUTION_NAME=$(gcloud run jobs executions list \

            --job=v33-9-paper-trader \

            --region=asia-northeast1 \

            --project=stock-auto-trader-506100 \

            --sort-by="~createTime" \

            --limit=1 \

            --format="value(metadata.name)")

          echo "Latest execution: $EXECUTION_NAME"

          gcloud logging read \

            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"v33-9-paper-trader\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION_NAME\"" \

            --project=stock-auto-trader-506100 \

            --limit=500 \

            --order=asc \

            --format="value(textPayload)" \

            > data/cloud_run_raw.txt

          if grep -q "15:45 結果" data/cloud_run_raw.txt; then

            awk '

              /15:45 結果/ {found=1}

              found {print}

              found && /Cloud Run Paper Trader END/ {exit}

            ' data/cloud_run_raw.txt > data/latest_result.txt

          elif grep -q "12:45 判定" data/cloud_run_raw.txt; then

            awk '

              /12:45 判定/ {found=1}

              found {print}

              found && /Cloud Run Paper Trader END/ {exit}

            ' data/cloud_run_raw.txt > data/latest_result.txt

          else

            grep -E '^(12:45 判定|15:45 結果|v33\.9|LONG|SHORT|現在資産|前資産|損益|候補|取引|持越し|決済)' \

              data/cloud_run_raw.txt > data/latest_result.txt || true

          fi

          if [ ! -s data/latest_result.txt ]; then

            echo "結果を取得できませんでした。" > data/latest_result.txt

          fi

          echo "===== MAIL RESULT ====="

          cat data/latest_result.txt

      - name: Save data

        run: |

          rm -f data/cloud_run_raw.txt

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ *.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then

            git commit -m "Update v33.9 paper trading data"

            git push

          else

            echo "No changes"

          fi

      - name: Send Email

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.mail.me.com

          server_port: 587

          username: ${{ secrets.MAIL_USER }}

          password: ${{ secrets.MAIL_PASS }}

          subject: "v33.9 Paper Trader"

          to: ${{ secrets.MAIL_TO }}

          from: ksk2823@icloud.com

          body: file://data/latest_result.txt
