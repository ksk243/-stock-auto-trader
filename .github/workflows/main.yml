name: v33.20 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "実行モード"

        required: true

        type: choice

        options:

          - decision

          - result

          - test

        default: decision

  schedule:

    # 15:45 JST

    - cron: "45 6 * * 1-5"

permissions:

  contents: write

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  REGION: asia-northeast1

  REPOSITORY: paper-trader

  IMAGE: asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

  WIF_PROVIDER: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

  GCS_BUCKET: stock-auto-trader-506100-paper

jobs:

  paper-trader:

    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:

      # =====================================================

      # Checkout

      # Node.js 24対応

      # =====================================================

      - name: Checkout

        uses: actions/checkout@v5

      # =====================================================

      # Determine run mode

      #

      # Cloud Scheduler 12:30 JST

      # → workflow_dispatch

      # → decision

      #

      # GitHub schedule 15:45 JST

      # → result

      # =====================================================

      - name: Determine run mode

        id: mode

        shell: bash

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            MODE="${{ inputs.run_mode }}"

            if [ -z "$MODE" ]; then

              MODE="decision"

            fi

          elif [ "${{ github.event.schedule }}" = "45 6 * * 1-5" ]; then

            MODE="result"

          else

            echo "ERROR: run mode could not be determined"

            exit 1

          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          echo "========================================"

          echo "RUN MODE: $MODE"

          echo "========================================"

      # =====================================================

      # Google Cloud Authentication

      # =====================================================

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ env.WIF_PROVIDER }}

          service_account: ${{ env.SERVICE_ACCOUNT }}

      # =====================================================

      # Setup gcloud

      # =====================================================

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: ${{ env.PROJECT_ID }}

      # =====================================================

      # Docker Authentication

      # =====================================================

      - name: Configure Docker

        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # =====================================================

      # Artifact Registry

      # =====================================================

      - name: Create Artifact Registry

        shell: bash

        run: |

          if gcloud artifacts repositories describe "${REPOSITORY}" --location="${REGION}" --project="${PROJECT_ID}" >/dev/null 2>&1; then

            echo "Artifact Registry repository already exists"

          else

            echo "Creating Artifact Registry repository"

            gcloud artifacts repositories create "${REPOSITORY}" --repository-format=docker --location="${REGION}" --project="${PROJECT_ID}" --description="Paper Trader Docker Repository"

          fi

      # =====================================================

      # Docker Build

      # =====================================================

      - name: Docker Build

        run: docker build -t "${IMAGE}:latest" .

      # =====================================================

      # Docker Push

      # =====================================================

      - name: Docker Push

        run: docker push "${IMAGE}:latest"

      # =====================================================

      # Deploy Cloud Run

      #

      # ここは改行しない

      # =====================================================

      - name: Deploy Cloud Run

        run: gcloud run deploy paper-trader --image="${IMAGE}:latest" --region="${REGION}" --project="${PROJECT_ID}" --platform=managed --allow-unauthenticated --set-env-vars="RUN_MODE=${{ steps.mode.outputs.mode }},GCS_BUCKET=${GCS_BUCKET}" --timeout=900

      # =====================================================

      # Get Cloud Run URL

      # =====================================================

      - name: Get Cloud Run URL

        id: cloudrun

        shell: bash

        run: |

          URL=$(gcloud run services describe paper-trader --region="${REGION}" --project="${PROJECT_ID}" --format='value(status.url)')

          if [ -z "$URL" ]; then

            echo "ERROR: Cloud Run URL could not be obtained"

            exit 1

          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "========================================"

          echo "Cloud Run URL"

          echo "========================================"

          echo "$URL"

      # =====================================================

      # Mail settings

      #

      # 判定前に確認しておく

      # =====================================================

      - name: Check mail settings

        shell: bash

        run: |

          echo "========================================"

          echo "メール設定確認"

          echo "========================================"

          if [ -z "${{ secrets.SMTP_HOST }}" ]; then

            echo "ERROR: SMTP_HOST が未設定です"

            exit 1

          fi

          if [ -z "${{ secrets.SMTP_PORT }}" ]; then

            echo "ERROR: SMTP_PORT が未設定です"

            exit 1

          fi

          if [ -z "${{ secrets.SMTP_USER }}" ]; then

            echo "ERROR: SMTP_USER が未設定です"

            exit 1

          fi

          if [ -z "${{ secrets.SMTP_PASSWORD }}" ]; then

            echo "ERROR: SMTP_PASSWORD が未設定です"

            exit 1

          fi

          if [ -z "${{ secrets.MAIL_TO }}" ]; then

            echo "ERROR: MAIL_TO が未設定です"

            exit 1

          fi

          if [ -z "${{ secrets.MAIL_USER }}" ]; then

            echo "ERROR: MAIL_USER が未設定です"

            exit 1

          fi

          echo "SMTP_HOST: 設定済み"

          echo "SMTP_PORT: 設定済み"

          echo "SMTP_USER: 設定済み"

          echo "SMTP_PASSWORD: 設定済み"

          echo "MAIL_TO: 設定済み"

          echo "MAIL_USER: 設定済み"

      # =====================================================

      # 日足事前準備

      #

      # decision と test の両方で実行

      # =====================================================

      - name: Prepare daily data

        if: steps.mode.outputs.mode == 'decision' || steps.mode.outputs.mode == 'test'

        shell: bash

        run: |

          URL="${{ steps.cloudrun.outputs.url }}"

          echo "========================================"

          echo "PREPARE DAILY DATA"

          echo "========================================"

          echo "MODE: ${{ steps.mode.outputs.mode }}"

          echo "========================================"

          curl --fail-with-body --retry 3 --retry-delay 5 --max-time 600 "${URL}/prepare"

      # =====================================================

      # decisionだけ12:45まで待つ

      #

      # testは待たない

      # =====================================================

      - name: Wait until 12:45 JST

        if: steps.mode.outputs.mode == 'decision'

        shell: bash

        run: |

          python <<'PY'

          from datetime import datetime

          from zoneinfo import ZoneInfo

          import time

          jst = ZoneInfo("Asia/Tokyo")

          now = datetime.now(jst)

          target = now.replace(

              hour=12,

              minute=45,

              second=0,

              microsecond=0

          )

          print("========================================")

          print("WAIT FOR 12:45 JST")

          print("========================================")

          print("Current:", now.strftime("%Y-%m-%d %H:%M:%S %Z"))

          print("Target :", target.strftime("%Y-%m-%d %H:%M:%S %Z"))

          if now < target:

              seconds = (target - now).total_seconds()

              print(f"Waiting {seconds:.0f} seconds...")

              time.sleep(seconds)

          else:

              print("Already 12:45 JST or later.")

              print("Start immediately.")

          print(

              "Start:",

              datetime.now(jst).strftime("%Y-%m-%d %H:%M:%S %Z")

          )

          PY

      # =====================================================

      # Paper Trader

      #

      # decision:

      # 12:45から5分足取得＋判定

      #

      # test:

      # 日足準備後すぐに5分足取得＋判定

      # =====================================================

      - name: Run Paper Trader

        shell: bash

        run: |

          URL="${{ steps.cloudrun.outputs.url }}"

          MODE="${{ steps.mode.outputs.mode }}"

          echo "========================================"

          echo "Run Paper Trader"

          echo "========================================"

          echo "URL: $URL"

          echo "MODE: $MODE"

          echo "========================================"

          curl --fail-with-body --retry 3 --retry-delay 10 --max-time 900 "${URL}/run?mode=${MODE}" | tee cloud_run_result.txt

      # =====================================================

      # Email body

      # =====================================================

      - name: Prepare immediate email

        shell: bash

        run: |

          cp cloud_run_result.txt latest_result.txt

          echo "========================================"

          echo "EMAIL RESULT"

          echo "========================================"

          cat latest_result.txt

      # =====================================================

      # 即メール

      #

      # dawidd6/action-send-mail を使用しない

      # Python標準ライブラリで送信

      # =====================================================

      - name: Send result email immediately

        env:

          SMTP_HOST: ${{ secrets.SMTP_HOST }}

          SMTP_PORT: ${{ secrets.SMTP_PORT }}

          SMTP_USER: ${{ secrets.SMTP_USER }}

          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          MAIL_TO: ${{ secrets.MAIL_TO }}

          MAIL_USER: ${{ secrets.MAIL_USER }}

          RUN_MODE: ${{ steps.mode.outputs.mode }}

        shell: bash

        run: |

          python <<'PY'

          import os

          import smtplib

          from email.message import EmailMessage

          with open(

              "latest_result.txt",

              "r",

              encoding="utf-8"

          ) as f:

              body = f.read()

          msg = EmailMessage()

          msg["Subject"] = (

              f"v33.20 Paper Trader "

              f"{os.environ['RUN_MODE']}"

          )

          msg["From"] = os.environ[

              "MAIL_USER"

          ]

          msg["To"] = os.environ[

              "MAIL_TO"

          ]

          msg.set_content(

              body

          )

          host = os.environ[

              "SMTP_HOST"

          ]

          port = int(

              os.environ[

                  "SMTP_PORT"

              ]

          )

          user = os.environ[

              "SMTP_USER"

          ]

          password = os.environ[

              "SMTP_PASSWORD"

          ]

          print(

              f"SMTP connection: "

              f"{host}:{port}"

          )

          with smtplib.SMTP(

              host,

              port,

              timeout=30

          ) as smtp:

              smtp.ehlo()

              smtp.starttls()

              smtp.ehlo()

              smtp.login(

                  user,

                  password

              )

              smtp.send_message(

                  msg

              )

          print(

              "メール送信成功"

          )

          PY

      # =====================================================

      # メール送信後の研究データ保存

      #

      # decisionのみ

      #

      # TESTはpaper_trader.py側で研究保存済み

      # =====================================================

      - name: Save research data after email

        if: steps.mode.outputs.mode == 'decision'

        shell: bash

        run: |

          URL="${{ steps.cloudrun.outputs.url }}"

          echo "========================================"

          echo "RESEARCH SAVE AFTER EMAIL"

          echo "========================================"

          curl --fail-with-body --retry 3 --retry-delay 5 --max-time 900 "${URL}/run?mode=research"

      # =====================================================

      # Download GCS files

      # =====================================================

      - name: Download result files from GCS

        shell: bash

        run: |

          mkdir -p data/research

          mkdir -p data

          echo "========================================"

          echo "GCS result files"

          echo "========================================"

          echo ""

          echo "screening_history.csv"

          if gcloud storage cp "gs://${GCS_BUCKET}/research/screening_history.csv" "data/research/screening_history.csv"; then

            echo "screening_history.csv downloaded"

          else

            echo "WARNING: screening_history.csv がGCSにありません"

            touch "data/research/screening_history.csv"

          fi

          echo ""

          echo "intraday_history.csv"

          if gcloud storage cp "gs://${GCS_BUCKET}/research/intraday_history.csv" "data/research/intraday_history.csv"; then

            echo "intraday_history.csv downloaded"

          else

            echo "WARNING: intraday_history.csv がGCSにありません"

            printf '%s\n' 'date,datetime,ticker,open,high,low,close,volume' > "data/research/intraday_history.csv"

          fi

          echo ""

          echo "portfolio.json"

          if gcloud storage cp "gs://${GCS_BUCKET}/paper_trader/portfolio.json" "data/portfolio.json"; then

            echo "portfolio.json downloaded"

          else

            echo "WARNING: portfolio.json がGCSにありません"

            python -c 'import json; json.dump(dict(equity=1117792, positions=[]), open("data/portfolio.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)'

          fi

          echo ""

          echo "paper_trades.csv"

          if gcloud storage cp "gs://${GCS_BUCKET}/paper_trader/paper_trades.csv" "data/paper_trades.csv"; then

            echo "paper_trades.csv downloaded"

          else

            echo "WARNING: paper_trades.csv がGCSにありません"

            printf '%s\n' 'date,ticker,side,shares,entry,exit,return,pnl,reason,entry_time,exit_time' > "data/paper_trades.csv"

          fi

          echo ""

          echo "========================================"

          echo "GCS download completed"

          echo "========================================"

      # =====================================================

      # Check research files

      # =====================================================

      - name: Check research files

        shell: bash

        run: |

          echo "========================================"

          echo "Research files"

          echo "========================================"

          echo ""

          echo "screening_history.csv"

          if [ -f "data/research/screening_history.csv" ]; then

            wc -l "data/research/screening_history.csv"

            ls -lh "data/research/screening_history.csv"

          else

            echo "ERROR: screening_history.csv が存在しません"

            exit 1

          fi

          echo ""

          echo "intraday_history.csv"

          if [ -f "data/research/intraday_history.csv" ]; then

            wc -l "data/research/intraday_history.csv"

            ls -lh "data/research/intraday_history.csv"

          else

            echo "ERROR: intraday_history.csv が存在しません"

            exit 1

          fi

      # =====================================================

      # Check portfolio

      # =====================================================

      - name: Check portfolio

        shell: bash

        run: |

          echo "========================================"

          echo "Portfolio check"

          echo "========================================"

          if [ -f "data/portfolio.json" ]; then

            cat "data/portfolio.json"

          else

            echo "ERROR: data/portfolio.json が存在しません"

            exit 1

          fi

      # =====================================================

      # Check result

      # =====================================================

      - name: Check result file

        shell: bash

        run: |

          echo "========================================"

          echo "latest_result.txt"

          echo "========================================"

          if [ -f "latest_result.txt" ]; then

            cat "latest_result.txt"

          else

            echo "ERROR: latest_result.txt が存在しません"

            exit 1

          fi

      # =====================================================

      # Save data to GitHub

      # =====================================================

      - name: Save data to GitHub

        shell: bash

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/research/screening_history.csv"

          git add "data/research/intraday_history.csv"

          git add "data/portfolio.json"

          git add "data/paper_trades.csv"

          git add "latest_result.txt"

          if git diff --cached --quiet; then

            echo "No data changes"

          else

            git commit -m "Update paper trader data"

            git push

          fi

      # =====================================================

      # Completed

      # =====================================================

      - name: Completed

        shell: bash

        run: |

          echo "========================================"

          echo "v33.20 Paper Trader completed"

          echo "========================================"

          echo "MODE: ${{ steps.mode.outputs.mode }}"

          echo "========================================"
