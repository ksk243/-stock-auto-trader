name: FIX11 Stage6 Forward Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "実行モード"

        required: true

        type: choice

        options:

          - test

          - snapshot

          - decision

          - result

        default: test

  schedule:

    # ========================================================

    # JST 12:45 / Mon-Fri

    # decision

    # ========================================================

    - cron: "45 3 * * 1-5"

    # ========================================================

    # JST 15:45 / Mon-Fri

    # result

    # ========================================================

    - cron: "45 6 * * 1-5"

    # ========================================================

    # JST 16:10 / Mon-Fri

    # snapshot

    #

    # Yahoo遅延を考慮して引け後に保存

    # ========================================================

    - cron: "10 7 * * 1-5"

permissions:

  contents: read

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  PROJECT_NUMBER: "913714190884"

  REGION: asia-northeast1

  SERVICE_NAME: fix11-forward-paper-trader

  ARTIFACT_REPOSITORY: paper-trader

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

  WIF_PROVIDER: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

  GCS_BUCKET: stock-auto-trader-506100-paper

jobs:

  deploy-and-run:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # ======================================================

      # Checkout

      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4

      # ======================================================

      # Google Auth

      # ======================================================

      - name: Google Auth

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ env.WIF_PROVIDER }}

          service_account: ${{ env.SERVICE_ACCOUNT }}

      # ======================================================

      # gcloud

      # ======================================================

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v3

      # ======================================================

      # Docker Auth

      # ======================================================

      - name: Docker Auth

        run: |

          gcloud auth configure-docker \

            ${{ env.REGION }}-docker.pkg.dev \

            --quiet

      # ======================================================

      # Build

      # ======================================================

      - name: Build image

        run: |

          docker build \

            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/fix11-forward:${{ github.sha }} \

            .

      # ======================================================

      # Push

      # ======================================================

      - name: Push image

        run: |

          docker push \

            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/fix11-forward:${{ github.sha }}

      # ======================================================

      # Deploy Cloud Run

      # ======================================================

      - name: Deploy Cloud Run

        run: |

          gcloud run deploy ${{ env.SERVICE_NAME }} \

            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/fix11-forward:${{ github.sha }} \

            --region=${{ env.REGION }} \

            --platform=managed \

            --service-account=${{ env.SERVICE_ACCOUNT }} \

            --memory=4Gi \

            --cpu=2 \

            --timeout=3600 \

            --concurrency=1 \

            --max-instances=1 \

            --no-allow-unauthenticated \

            --set-env-vars=GCS_BUCKET=${{ env.GCS_BUCKET }},FIX11_DATA_DIR=fix11_forward \

            --quiet

      # ======================================================

      # Service URL

      # ======================================================

      - name: Get service URL

        id: service

        run: |

          URL=$(gcloud run services describe \

            ${{ env.SERVICE_NAME }} \

            --region=${{ env.REGION }} \

            --format='value(status.url)')

          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "Cloud Run URL:"

          echo "$URL"

      # ======================================================

      # Health Check

      # ======================================================

      - name: Health check

        run: |

          URL="${{ steps.service.outputs.url }}"

          TOKEN=$(gcloud auth print-identity-token)

          curl \

            --fail \

            --show-error \

            --silent \

            --header "Authorization: Bearer ${TOKEN}" \

            "${URL}/"

      # ======================================================

      # Decide run mode

      # ======================================================

      - name: Determine run mode

        id: mode

        shell: bash

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            MODE="${{ github.event.inputs.run_mode }}"

          else

            HOUR=$(date -u +'%H')

            MINUTE=$(date -u +'%M')

            if [ "$HOUR" = "03" ] && [ "$MINUTE" = "45" ]; then

              MODE="decision"

            elif [ "$HOUR" = "06" ] && [ "$MINUTE" = "45" ]; then

              MODE="result"

            elif [ "$HOUR" = "07" ] && [ "$MINUTE" = "10" ]; then

              MODE="snapshot"

            else

              MODE="test"

            fi

          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          echo "RUN_MODE=$MODE"

      # ======================================================

      # Run

      # ======================================================

      - name: Run FIX11 Forward

        id: run_fix11

        shell: bash

        run: |

          URL="${{ steps.service.outputs.url }}"

          MODE="${{ steps.mode.outputs.mode }}"

          TOKEN=$(gcloud auth print-identity-token)

          echo "Calling:"

          echo "${URL}/run?mode=${MODE}"

          HTTP_CODE=$(curl \

            --show-error \

            --silent \

            --location \

            --output response.txt \

            --write-out "%{http_code}" \

            --header "Authorization: Bearer ${TOKEN}" \

            "${URL}/run?mode=${MODE}")

          echo "HTTP_CODE=$HTTP_CODE"

          echo ""

          echo "================ RESPONSE ================"

          cat response.txt

          echo "=========================================="

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then

            exit 1

          fi

      # ======================================================

      # Email

      # ======================================================

      - name: Send result email

        if: always()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: ${{ secrets.SMTP_HOST }}

          server_port: ${{ secrets.SMTP_PORT }}

          username: ${{ secrets.SMTP_USER }}

          password: ${{ secrets.SMTP_PASSWORD }}

          subject: FIX11 Forward ${{ steps.mode.outputs.mode }} - ${{ job.status }}

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USER }}

          body: file://response.txt
