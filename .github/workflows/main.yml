name: v33.8 Paper Trader

on:

  workflow_dispatch:

  schedule:

    - cron: "30 3 * * 1-5"

jobs:

  deploy-and-run:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:

      contents: read

      id-token: write

    steps:

    - name: Checkout

      uses: actions/checkout@v4

    - name: Google Cloud Auth

      uses: google-github-actions/auth@v2

      with:

        workload_identity_provider: "projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github"

        service_account:

          github-actions@stock-auto-trader-506100.iam.gserviceaccount.com

    - name: Setup gcloud

      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker

      run: |

        gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

    - name: Build Image

      run: |

        docker build \

        -t asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-8:latest .

    - name: Push Image

      run: |

        docker push \

        asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-8:latest

    - name: Deploy Cloud Run Job

      run: |

        gcloud run jobs deploy v33-8-paper-trader \

        --image asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-8:latest \

        --region asia-northeast1 \

        --tasks 1 \

        --max-retries 1

    - name: Execute Job

      run: |

        gcloud run jobs execute v33-8-paper-trader \

        --region asia-northeast1 \

        --wait
