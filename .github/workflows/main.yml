name: v33.20 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "decision / result / test"

        required: true

        default: "test"

permissions:

  contents: write

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  REGION: asia-northeast1

  REPOSITORY: paper-trader

  IMAGE: asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

  WIF_PROVIDER: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

  GCS_BUCKET: stock-auto-trader-506100-paper

jobs:

  paper-trader:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ env.WIF_PROVIDER }}

          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker

        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry

        run: gcloud artifacts repositories describe "$REPOSITORY" --location="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1 || gcloud artifacts repositories create "$REPOSITORY" --repository-format=docker --location="$REGION" --project="$PROJECT_ID" --description="Paper Trader Docker Repository"

      - name: Docker Build

        run: docker build -t "$IMAGE:latest" .

      - name: Docker Push

        run: docker push "$IMAGE:latest"

      - name: Deploy Cloud Run

        run: gcloud run deploy paper-trader --image="$IMAGE:latest" --region="$REGION" --project="$PROJECT_ID" --platform=managed --allow-unauthenticated --set-env-vars="RUN_MODE=${{ inputs.run_mode }},GCS_BUCKET=$GCS_BUCKET"

      - name: Wait for Cloud Run

        run: sleep 10

      - name: Get Cloud Run result

        run: |

          mkdir -p data

          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="paper-trader"' --project="$PROJECT_ID" --limit=500 --format="value(textPayload)" > data/cloud_run_log.txt || true

      - name: Download research data

        run: |

          mkdir -p data/research

          rm -f data/research/screening_history.csv

          gcloud storage cp "gs://$GCS_BUCKET/research/screening_history.csv" "data/research/screening_history.csv" || true

      - name: Download latest result

        run: |

          mkdir -p data

          gcloud storage cp "gs://$GCS_BUCKET/latest_result.txt" "data/latest_result.txt" || true

      - name: Save research data to GitHub

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          git diff --cached --quiet || git commit -m "Update Paper Trader data"

          git push || true

      - name: Prepare email

        run: |

          if [ -f data/latest_result.txt ]; then

            cp data/latest_result.txt email_body.txt

          elif [ -f data/cloud_run_log.txt ]; then

            cp data/cloud_run_log.txt email_body.txt

          else

            echo "Paper Trader result not found." > email_body.txt

          fi

      - name: Send email

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: ${{ secrets.SMTP_HOST }}

          server_port: ${{ secrets.SMTP_PORT }}

          username: ${{ secrets.SMTP_USER }}

          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "v33.20 Paper Trader - ${{ inputs.run_mode }}"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USER }}

          body: file://email_body.txt

      - name: End

        run: |

          echo "================================"

          echo "v33.20 Paper Trader END"

          echo "================================"

          echo "RUN_MODE: ${{ inputs.run_mode }}"

          echo "================================"
