name: v33.18 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "実行モード"

        required: true

        type: choice

        options:

          - decision

          - result

          - test

        default: decision

  schedule:

    # 12:45 JST

    - cron: "45 3 * * 1-5"

    # 15:45 JST

    - cron: "45 6 * * 1-5"

jobs:

  deploy-and-run:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:

      contents: write

      id-token: write

    steps:

      # =====================================================

      # Checkout

      # =====================================================

      - name: Checkout

        uses: actions/checkout@v4

      # =====================================================

      # RUN MODE

      # =====================================================

      - name: Set RUN_MODE

        shell: bash

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            RUN_MODE="${{ inputs.run_mode }}"

          else

            HOUR=$(TZ=Asia/Tokyo date +%H)

            if [ "$HOUR" = "12" ]; then

              RUN_MODE="decision"

            else

              RUN_MODE="result"

            fi

          fi

          echo "RUN_MODE=$RUN_MODE" >> "$GITHUB_ENV"

          echo "================================"

          echo "RUN_MODE=$RUN_MODE"

          echo "================================"

      # =====================================================

      # Google Cloud Auth

      # =====================================================

      - name: Google Cloud Auth

        uses: google-github-actions/auth@v2

        with:

          workload_identity_provider: "projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github"

          service_account: "github-actions@stock-auto-trader-506100.iam.gserviceaccount.com"

      # =====================================================

      # Setup gcloud

      # =====================================================

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v2

      # =====================================================

      # Docker authentication

      # =====================================================

      - name: Configure Docker

        shell: bash

        run: |

          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # =====================================================

      # Docker Build

      # =====================================================

      - name: Build Docker Image

        shell: bash

        run: |

          docker build --no-cache -t asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-18:latest .

      # =====================================================

      # Docker Push

      # =====================================================

      - name: Push Docker Image

        shell: bash

        run: |

          docker push asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-18:latest

      # =====================================================

      # Cloud Run Deploy

      # =====================================================

      - name: Deploy Cloud Run Job

        shell: bash

        run: |

          gcloud run jobs deploy v33-18-paper-trader --image=asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/stock-auto-trader/v33-18:latest --region=asia-northeast1 --project=stock-auto-trader-506100 --tasks=1 --max-retries=1 --set-env-vars="RUN_MODE=$RUN_MODE"

      # =====================================================

      # Cloud Run Execute

      # =====================================================

      - name: Run Cloud Run Job

        shell: bash

        run: |

          echo "================================"

          echo "RUNNING CLOUD RUN JOB"

          echo "RUN_MODE=$RUN_MODE"

          echo "================================"

          gcloud run jobs execute v33-18-paper-trader \

            --region=asia-northeast1 \

            --project=stock-auto-trader-506100 \

            --wait

      # =====================================================

      # Get Latest Execution

      # =====================================================

      - name: Get Latest Execution

        shell: bash

        run: |

          EXECUTION_NAME=$(gcloud run jobs executions list --job=v33-18-paper-trader --region=asia-northeast1 --project=stock-auto-trader-506100 --sort-by="~createTime" --limit=1 --format="value(metadata.name)")

          if [ -z "$EXECUTION_NAME" ]; then

            echo "Cloud Run execution が取得できませんでした。"

            exit 1

          fi

          echo "EXECUTION_NAME=$EXECUTION_NAME"

          echo "EXECUTION_NAME=$EXECUTION_NAME" >> "$GITHUB_ENV"

      # =====================================================

      # Get Cloud Run Log

      # =====================================================

      - name: Get Cloud Run Result

        shell: bash

        run: |

          mkdir -p data

          echo "================================"

          echo "CLOUD RUN LOG"

          echo "================================"

          gcloud logging read \

            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"v33-18-paper-trader\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION_NAME\"" \

            --project=stock-auto-trader-506100 \

            --limit=1000 \

            --order=asc \

            --format="value(textPayload)" \

            > data/cloud_run_raw.txt

          cat data/cloud_run_raw.txt

          echo "================================"

          echo "EXTRACT RESULT"

          echo "================================"

          if [ "$RUN_MODE" = "decision" ]; then

            awk '

              /12:45 判定/ {

                found=1

              }

              found {

                print

              }

              found && /v33\.18 END/ {

                exit

              }

            ' data/cloud_run_raw.txt > data/latest_result.txt

          elif [ "$RUN_MODE" = "test" ]; then

            awk '

              /12:45 TEST判定/ {

                found=1

              }

              found {

                print

              }

              found && /v33\.18 END/ {

                exit

              }

            ' data/cloud_run_raw.txt > data/latest_result.txt

          elif [ "$RUN_MODE" = "result" ]; then

            awk '

              /15:45 結果/ {

                found=1

              }

              found {

                print

              }

              found && /v33\.18 END/ {

                exit

              }

            ' data/cloud_run_raw.txt > data/latest_result.txt

          else

            echo "未知のRUN_MODE: $RUN_MODE"

            exit 1

          fi

      # =====================================================

      # Check Result

      # =====================================================

      - name: Check Result

        shell: bash

        run: |

          echo "================================"

          echo "LATEST RESULT"

          echo "================================"

          if [ -s data/latest_result.txt ]; then

            cat data/latest_result.txt

          else

            echo "結果を取得できませんでした。"

            echo

            echo "RUN_MODE=$RUN_MODE"

            echo

            echo "EXECUTION_NAME=$EXECUTION_NAME"

            echo

            echo "CLOUD RUN RAW LOG:"

            cat data/cloud_run_raw.txt

            exit 1

          fi

      # =====================================================

      # Save Result

      # =====================================================

      - name: Save Result

        shell: bash

        run: |

          rm -f data/cloud_run_raw.txt

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest_result.txt

          if ! git diff --cached --quiet; then

            git commit -m "Update v33.18 result"

            git push

          else

            echo "No result changes"

          fi

      # =====================================================

      # Send Email

      # =====================================================

      - name: Send Email

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.mail.me.com

          server_port: 587

          username: ${{ secrets.MAIL_USER }}

          password: ${{ secrets.MAIL_PASS }}

          subject: "v33.18 Paper Trader [$RUN_MODE]"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USER }}

          body: file://data/latest_result.txt
