name: v33.20 Paper Trader

on:

  workflow_dispatch:

    inputs:

      run_mode:

        description: "decision / result / test"

        required: true

        default: "test"

permissions:

  contents: write

  id-token: write

env:

  PROJECT_ID: stock-auto-trader-506100

  REGION: asia-northeast1

  REPOSITORY: paper-trader

  IMAGE: asia-northeast1-docker.pkg.dev/stock-auto-trader-506100/paper-trader/paper-trader

  SERVICE_ACCOUNT: 913714190884-compute@developer.gserviceaccount.com

  WIF_PROVIDER: projects/913714190884/locations/global/workloadIdentityPools/github-pool/providers/github

  GCS_BUCKET: stock-auto-trader-506100-paper

jobs:

  paper-trader:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud

        uses: google-github-actions/auth@v3

        with:

          workload_identity_provider: ${{ env.WIF_PROVIDER }}

          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Setup gcloud

        uses: google-github-actions/setup-gcloud@v3

        with:

          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker

        run: |

          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Create Artifact Registry

        run: |

          gcloud artifacts repositories describe paper-trader --location=asia-northeast1 --project=stock-auto-trader-506100 >/dev/null 2>&1 || gcloud artifacts repositories create paper-trader --repository-format=docker --location=asia-northeast1 --project=stock-auto-trader-506100 --description="Paper Trader Docker Repository"

      - name: Docker Build

        run: |

          docker build -t "$IMAGE:latest" .

      - name: Docker Push

        run: |

          docker push "$IMAGE:latest"

      - name: Deploy Cloud Run

        run: |

          gcloud run deploy paper-trader --image="$IMAGE:latest" --region=asia-northeast1 --project=stock-auto-trader-506100 --platform=managed --allow-unauthenticated --set-env-vars="RUN_MODE=${{ inputs.run_mode }},GCS_BUCKET=stock-auto-trader-506100-paper" --timeout=900

      - name: Get Cloud Run URL

        id: cloudrun

        run: |

          URL=$(gcloud run services describe paper-trader --region=asia-northeast1 --project=stock-auto-trader-506100 --format='value(status.url)')

          echo "url=$URL" >> "$GITHUB_OUTPUT"

          echo "Cloud Run URL: $URL"

      - name: Run Paper Trader

        run: |

          URL="${{ steps.cloudrun.outputs.url }}"

          echo "Cloud Run URL: $URL"

          curl --fail-with-body --retry 3 --retry-delay 10 --max-time 900 "$URL/run?mode=${{ inputs.run_mode }}" | tee cloud_run_result.txt

      - name: Test

        run: |

          echo "========================================"

          echo "v33.20 Paper Trader"

          echo "Cloud Run Deploy OK"

          echo "Cloud Run execution OK"

          echo "========================================"
